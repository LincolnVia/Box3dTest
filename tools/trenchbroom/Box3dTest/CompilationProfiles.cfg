{
	"profiles": [
		{
			"name": "Compile",
			"tasks": [
				{
					"enabled": true,
					"stripTbProperties": false,
					"target": "${WORK_DIR_PATH}/${MAP_BASE_NAME}-compile.map",
					"type": "export"
				},
				{
					"enabled": true,
					"parameters": "-notex -missing_textures_as_zero_size ${MAP_BASE_NAME}-compile.map ${MAP_BASE_NAME}.bsp",
					"tool": "${qbsp}",
					"treatNonZeroResultCodeAsError": false,
					"type": "tool"
				},
				{
					"enabled": true,
					"parameters": "${MAP_BASE_NAME}.bsp",
					"tool": "${vis}",
					"treatNonZeroResultCodeAsError": false,
					"type": "tool"
				},
				{
					"enabled": true,
					"parameters": "${MAP_BASE_NAME}.bsp",
					"tool": "${light}",
					"treatNonZeroResultCodeAsError": false,
					"type": "tool"
				},
				{
					"enabled": true,
					"source": "${MAP_BASE_NAME}.bsp",
					"target": "${MAP_DIR_PATH}/../../build/dev/resources/scenes/",
					"type": "copy"
				},
				{
					"enabled": true,
					"parameters": "",
					"tool": "${MAP_DIR_PATH}/../../build/dev/Box3dGame",
					"treatNonZeroResultCodeAsError": false,
					"type": "tool"
				}
			],
			"workdir": "${MAP_DIR_PATH}"
		}
	],
	"version": 1
}
